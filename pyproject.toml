[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-synthesis-assistant"
version = "1.0.0"
description = "LLM-powered qualitative research synthesis and PRD extraction pipeline"
authors = [{ name = "Manav Anandani", email = "anandanimr@rknec.edu" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=1.5.0",
    "rich>=13.0.0",
]

[project.scripts]
synthesize = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
